<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2200" viewBox="0 0 1800 2200">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 42px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #526070; }
      .entity { fill: #ffffff; stroke: #26364d; stroke-width: 2; rx: 8; }
      .head { fill: #26364d; }
      .headText { font: 700 18px Arial, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .field { font: 14px Consolas, "Courier New", monospace; fill: #1f2937; }
      .pk { fill: #0f766e; font-weight: 700; }
      .fk { fill: #1d4ed8; font-weight: 700; }
      .uk { fill: #b45309; font-weight: 700; }
      .rel { fill: none; stroke: #64748b; stroke-width: 2; }
      .relText { font: 13px Arial, sans-serif; fill: #334155; }
      .noteBox { fill: #eef6ff; stroke: #8ab4f8; stroke-width: 1.5; rx: 8; }
      .note { font: 15px Arial, sans-serif; fill: #1e3a5f; }
      .legend { font: 15px Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="many" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="strokeWidth">
