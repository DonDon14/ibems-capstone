name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, intl, mbstring, mysqli, sqlite3, xml, xmlwriter
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare writable runtime directories
        run: |
          mkdir -p writable/cache writable/debugbar writable/logs writable/session writable/uploads public/uploads
          mkdir -p build/logs
          chmod -R u+rwX writable build

      - name: Check PHP syntax
        run: find app tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: find public/assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run PHPUnit suite
        run: npm test

      - name: Verify generated Tailwind asset
        run: |
          npm run build:tailwind
          git diff --exit-code -- public/assets/css/tailwind.css
